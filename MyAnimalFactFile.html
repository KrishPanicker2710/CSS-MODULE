<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Animal Fact File</title>
    <style>
        body {
            background-color: darkgreen;
            font-family: Arial, sans-serif;
        }
        .fact-file {
            background-color: lightyellow;
            color: darkslategray;
            width: 260px;
            padding: 25px;
            border: 4px solid forestgreen;
            margin: 30px;
        }
        .animal-name {
            color: forestgreen;
            font-size: 22px;
        }
        .details {
            color: darkslategray;
        }
        .cool-fact {
            color: darkorange;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class = "fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="details">Type: Big Cat</p>
        <p class="details">Lives in the mountain ranges of central Asia.</p>
        <p class="details">Diet: Deer, goat and wild sheep</p>
        <p class="cool-fact">Cool Fact: Can leap upto 15 meters in one jump!</p>
    </div>
</body>
</html>
